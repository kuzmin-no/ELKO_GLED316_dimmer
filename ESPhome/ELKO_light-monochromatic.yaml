esphome:
  name: elko-gled316-03
  friendly_name: elko-gled316-03
  on_boot:
    then:
      uart.write: "\rSTA\r"

esp8266:
  board: nodemcuv2

# Enable logging
logger:
  baud_rate: 0

wifi:
  id: wificomp
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

globals:
  - id: changing_state
    type: bool
    restore_value: no
    initial_value: 'false'

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      delimiter: "\r"
    sequence:
      - lambda: |-
          //UARTDebug::log_string(direction, bytes);

          // direction: 1 - send, 0 - receive
          if (direction == 0) {
            int powState=0;
            int dimState=0;
            int HAdimState=0;
            std::string str(bytes.begin(), bytes.end());

            if (sscanf(str.c_str(), "OK %d,%d\r", &powState, &dimState) == 2 ) {
              HAdimState = int(id(dimmer).remote_values.get_brightness() * 100.0f);

              // Make sure that dimmer is not changing its state from HA
              if (not id(changing_state)) {
                if ((powState == 1) && (not id(dimmer).remote_values.is_on())) {
                  ESP_LOGD("uart", "Light on");
                  id(dimmer).turn_on().perform();
                } else if ((powState == 0) && (id(dimmer).remote_values.is_on())) {
                  ESP_LOGD("uart", "Light off");
                  id(dimmer).turn_off().perform();
                }
                if ((powState == 1) && (dimState != HAdimState)) {
                  id(dimmer).remote_values.set_brightness(dimState / 100.0f);
                  id(dimmer).publish_state();
                  ESP_LOGD("uart", "dimState %d", dimState);
                }
              }
            }

            if (str.find("RES\r") != std::string::npos) {
              ESP_LOGD("uart", "Restart");
              delay(5000);
              id(switch_restart).turn_on();
            }

            if (str.find("LRN\r") != std::string::npos) {
              ESP_LOGD("uart", "AP mode");
              delay(5000);
              id(activate_wifi_fallback).execute();
            }
          }

script:
  - id: activate_wifi_fallback
    mode: restart
    then:
      - lambda: |-
          id(wificomp).set_ap_timeout(1);
          id(wificomp).disable();
          id(wificomp).clear_sta();
          id(wificomp).enable();
      - delay: 600s
      - switch.turn_on: switch_restart

switch:
  - platform: restart
    id: switch_restart
    internal: True

light:
  - platform: monochromatic
    name: "Test light 1"
    output: dimmer_output
    default_transition_length: 0s
    id: dimmer

output:
  - platform: template
    type: float
    id: dimmer_output
    write_action:
      then:
        - globals.set:
            id: changing_state
            value: 'true'
        - uart.write: !lambda
            char buf[10];
            sprintf(buf, "\rDIM %d\r", int(round(id(dimmer).remote_values.get_brightness() * 100.0f)));
            std::string s = buf;
            return std::vector<unsigned char>(s.begin(), s.end());
        - uart.write: !lambda
            char buf[10];
            sprintf(buf, "\rPOW %d\r", int(id(dimmer).remote_values.is_on()));
            std::string s = buf;
            return std::vector<unsigned char>(s.begin(), s.end());
        - delay: 500ms
        - globals.set:
            id: changing_state
            value: 'false'
