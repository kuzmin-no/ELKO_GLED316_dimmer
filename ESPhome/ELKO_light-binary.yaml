esphome:
  name: elko-gled316-01
  friendly_name: elko-gled316-01
  on_boot:
    then:
      uart.write: "\rSTA\r"

esp8266:
  board: nodemcuv2

# Enable logging
logger:
  baud_rate: 0

wifi:
  id: wificomp
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      delimiter: "\r"
    sequence:
      - lambda: |-
          //UARTDebug::log_string(direction, bytes);

          // direction: 1 - send, 0 - receive
          if (direction == 0) {
            int powState=0;
            int dimState=0;
            std::string str(bytes.begin(), bytes.end());

            if (sscanf(str.c_str(), "OK %d,%d\r", &powState, &dimState) == 2 ) {
              if ((powState == 1) && (not id(dimmer).remote_values.is_on())) {
                ESP_LOGD("uart", "Light on");
                id(dimmer).turn_on().perform();
              } else if ((powState == 0) && (id(dimmer).remote_values.is_on())) {
                ESP_LOGD("uart", "Light off");
                id(dimmer).turn_off().perform();
              }
            }

            if (str.find("RES\r") != std::string::npos) {
              ESP_LOGD("uart", "Restart");
              delay(5000);
              id(switch_restart).turn_on();
            }

            if (str.find("LRN\r") != std::string::npos) {
              ESP_LOGD("uart", "AP mode");
              delay(5000);
              id(activate_wifi_fallback).execute();
            }
          }

script:
  - id: activate_wifi_fallback
    mode: restart
    then:
      - lambda: |-
          id(wificomp).set_ap_timeout(1);
          id(wificomp).disable();
          id(wificomp).clear_sta();
          id(wificomp).enable();
      - delay: 600s
      - switch.turn_on: switch_restart

switch:
  - platform: restart
    id: switch_restart
    internal: True

light:
  - platform: binary
    name: "Test light 1"
    output: dimmer_output
    id: dimmer

output:
  - platform: template
    type: binary
    id: dimmer_output
    write_action:
      then:
        uart.write: !lambda
          char buf[10];
          sprintf(buf, "\rPOW %d\r", state);
          std::string s = buf;
          return std::vector<unsigned char>(s.begin(), s.end());
